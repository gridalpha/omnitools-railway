# Main nginx configuration for OmniTools on Railway.
#
# Derived from the stock nginxinc/nginx-unprivileged config. Every temp path
# stays under /tmp and the pid stays at /tmp/nginx.pid because the container
# runs as uid 101 and cannot write anywhere else.
#
# `worker_processes auto` is rewritten in place at boot by the image's own
# /docker-entrypoint.d/30-tune-worker-processes.sh, which reads the cgroup CPU
# quota. Leave the directive on its own line and spelled exactly like this, or
# that script's sed will not match it.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Patched in the Dockerfile to map .mjs as well as .js -- four chunks in
    # this build (pdf.js' worker, the onnxruntime bundles) use that extension.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Railway's edge overwrites any client-supplied X-Forwarded-For, so the
    # LEFTMOST entry is the real caller. Do not swap this for the realip module
    # with real_ip_recursive: that walks right to left and stops on the edge's
    # own hop, which rotates per request, so every log line would name a
    # different Railway address instead of the visitor.
    map $http_x_forwarded_for $real_client_ip {
        '~^\s*(?P<first>[^,\s]+)'  $first;
        default                    $remote_addr;
    }

    # The edge terminates TLS and speaks plain HTTP to this container, and it
    # adds no HSTS of its own. Emit the header only for requests that really
    # arrived over HTTPS; nginx omits a header whose value is the empty string,
    # so the plain-HTTP health probe simply does not receive one.
    map $http_x_forwarded_proto $hsts_header {
        https    'max-age=31536000; includeSubDomains';
        default  '';
    }

    log_format  main  '$real_client_ip - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Upstream's image compresses nothing and ships no pre-compressed siblings,
    # so the Dockerfile gzips every js/mjs/css/svg/html/json/wasm file over
    # 1 KB at build time and gzip_static hands those out directly. The
    # onnxruntime blob alone is 22.8 MB uncompressed. `gzip on` covers whatever
    # has no sibling, including the robots.txt written at boot.
    gzip_static     on;
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/wasm application/xml
                    application/manifest+json
                    image/svg+xml font/ttf font/woff font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
